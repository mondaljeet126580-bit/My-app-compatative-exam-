<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>General Knowledge</title>
  <meta name="theme-color" content="#0f6b35" />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;background:#073b21;color:#fff;overflow-x:hidden}
    .main{max-width:1100px;margin:0 auto;padding:24px 14px 50px}
    .back{display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(242,201,76,.45);padding:10px 20px;border-radius:999px;font-weight:700;margin-bottom:26px}
    .title{display:flex;align-items:center;gap:12px;font-size:1.6rem;font-weight:700;margin-bottom:24px}.title:before{content:"";width:6px;height:34px;border-radius:6px;background:linear-gradient(#f2c94c,#16a34a)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .card{display:block;text-decoration:none;background:linear-gradient(160deg,#fff 0%,#f7fcf8 55%,#fffdf2 100%);color:#10251a;border-radius:24px;padding:20px 16px;min-height:190px;box-shadow:0 12px 30px rgba(0,0,0,.18);cursor:pointer}
    .card-icon{font-size:48px;margin-bottom:28px}.card h2{margin:0 0 8px;font-size:1.2rem}.card p{margin:0;color:#617168;line-height:1.5;font-size:.92rem}
  </style>
</head>
<body>
  <main class="main">
    <a class="back" href="index.html">← Back</a>
    <div class="title">General Knowledge</div>
    <section class="grid">
      <article class="card"><div class="card-icon">🏛️</div><h2>History</h2><p>Ancient, Medieval, Modern History</p></article>
      <article class="card"><div class="card-icon">🗺️</div><h2>Geography</h2><p>Physical, Indian, World Geography</p></article>
      <article class="card"><div class="card-icon">⚖️</div><h2>Polity</h2><p>Constitution, Rights, Parliament</p></article>
      <article class="card"><div class="card-icon">💰</div><h2>Economic</h2><p>Money, Banking, Budget</p></article>
      <article class="card"><div class="card-icon">📚</div><h2>Static GK</h2><p>Important static facts</p></article>
    </section>
  </main>
</body>
</html>
