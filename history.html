<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background:#073b21;color:#fff}.main{max-width:1100px;margin:0 auto;padding:24px 14px 50px}
.back{display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(242,201,76,.45);padding:10px 20px;border-radius:999px;font-weight:700;margin-bottom:26px}
.title{display:flex;align-items:center;gap:12px;font-size:1.6rem;font-weight:700;margin-bottom:24px}.title:before{content:"";width:6px;height:34px;border-radius:6px;background:linear-gradient(#f2c94c,#16a34a)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:linear-gradient(160deg,#fff 0%,#f7fcf8 55%,#fffdf2 100%);color:#10251a;border-radius:24px;padding:20px 16px;min-height:190px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.card-icon{font-size:48px;margin-bottom:28px}.card h2{margin:0;font-size:1.2rem}.card p{margin:8px 0 0;color:#617168;line-height:1.5;font-size:.92rem}
@media(max-width:560px){.grid{gap:14px}.card{min-height:175px}.card-icon{font-size:42px;margin-bottom:22px}}
</style>
</head>
<body>
<main class="main">
<a class="back" href="general-knowledge.html">← Back</a>
<div class="title">History</div>
<section class="grid">
<article class="card"><div class="card-icon">🏛️</div><h2>Ancient</h2><p>Ancient History</p></article>
<article class="card"><div class="card-icon">📜</div><h2>Medieval</h2><p>Medieval History</p></article>
<article class="card"><div class="card-icon">🕰️</div><h2>Modern History</h2><p>Modern History</p></article>
</section>
</main>
</body>
</html>
