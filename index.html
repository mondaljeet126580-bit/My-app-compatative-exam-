<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SSC Smart Study</title>
  <meta name="description" content="Study, practice MCQs, and take timed mock tests for SSC exam preparation." />

  <!-- Matches the new premium palette in css/style.css -->
  <meta name="theme-color" content="#0b3d91" />

  <!-- App-like feel when added to a phone home screen -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SSC Smart Study" />

  <!-- Simple inline favicon so the app has a tab icon (no extra file needed) -->

  <!-- Faster font loading for the Lexend / Inter / JetBrains Mono used in css/style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon">📘</div>
      <div>
        <h1>SSC Smart Study</h1>
        <p>Study • Practice • Test • Improve</p>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="app"></section>
  </main>

  <noscript>
    <div style="max-width:1100px;margin:24px auto;padding:16px;">
      Please enable JavaScript to use SSC Smart Study.
    </div>
  </noscript>

  <script src="js/app.js"></script>
</body>
</html>
