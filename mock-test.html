<style>
:root{--navy-950:#0a1220;--navy-900:#0f1c30;--navy-800:#16283f;--navy-700:#1e3450;--steel-500:#7c8aa0;--steel-300:#aab6c8;--off-white:#eef1f5;--white:#fff;--green-500:#1fa259;--green-600:#17864a;--amber-500:#e6a23c;--red-500:#e0525a;--violet-500:#8b6cf6;--radius-lg:18px;--radius-md:12px;--radius-sm:8px;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:radial-gradient(circle at 15% 0%,rgba(31,162,89,.10),transparent 45%),radial-gradient(circle at 100% 20%,rgba(139,108,246,.08),transparent 40%),var(--navy-950);font-family:var(--font-body);color:var(--off-white);min-height:100vh;padding-bottom:40px}.rail-strip{height:6px;width:100%;background:repeating-linear-gradient(90deg,var(--steel-500) 0 18px,transparent 18px 30px);opacity:.35}.app{max-width:1180px;margin:0 auto;padding:18px 16px 0}.header{background:linear-gradient(180deg,var(--navy-800),var(--navy-900));border:1px solid var(--navy-700);border-radius:var(--radius-lg);padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.header-left .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--green-500);text-transform:uppercase;margin:0 0 6px}.header-left h1{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0 0 6px;color:var(--white)}.header-left .subject-tag{display:inline-block;font-size:12.5px;color:var(--steel-300);background:rgba(255,255,255,.05);border:1px solid var(--navy-700);padding:3px 10px;border-radius:999px}.timer-box{text-align:right}.timer-box .timer-label{font-family:var(--font-mono);font-size:10.5px;color:var(--steel-300);text-transform:uppercase;margin:0 0 6px}.led{font-family:var(--font-mono);font-weight:700;font-size:28px;letter-spacing:.06em;color:var(--amber-500);background:#08101d;border:1px solid var(--navy-700);border-radius:var(--radius-sm);padding:6px 14px}.led.danger{color:var(--red-500);animation:pulse 1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}.journey{margin-top:16px;padding:16px 20px 20px;background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg)}.journey-label{display:flex;justify-content:space-between;font-size:12px;color:var(--steel-300);margin-bottom:14px}.track-wrap{position:relative;height:6px;border-radius:99px;background:var(--navy-700)}.track-fill{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-600),var(--green-500));transition:width .35s ease}.train-marker{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;transition:left .35s ease}.question-card{margin-top:16px;background:var(--off-white);color:#182234;border-radius:var(--radius-lg);padding:22px 20px 20px}.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.q-count{font-family:var(--font-mono);font-size:13px;color:#5b6779;font-weight:500}.q-status-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff}.q-text{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.5;margin:0 0 18px;color:#101a2b}.options{display:flex;flex-direction:column;gap:10px}.option{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-md);border:1.5px solid #d7dde6;background:#fff;cursor:pointer;font-size:15.5px;text-align:left}.option .badge{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.5px solid #c6cdd8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#5b6779;font-family:var(--font-mono)}.option .opt-text{flex:1}.option.selected{border-color:var(--green-500);background:rgba(31,162,89,.08)}.option.selected .badge{background:var(--green-500);border-color:var(--green-500);color:#fff}.option.correct{border-color:var(--green-500);background:rgba(31,162,89,.14)}.option.correct .badge{background:var(--green-500);border-color:var(--green-500);color:#fff}.option.wrong{border-color:var(--red-500);background:rgba(224,82,90,.14)}.option.wrong .badge{background:var(--red-500);border-color:var(--red-500);color:#fff}.actions{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{font-family:var(--font-body);font-weight:600;font-size:14.5px;padding:13px 14px;border-radius:var(--radius-md);border:1.5px solid var(--navy-700);cursor:pointer;background:var(--navy-800);color:var(--off-white)}.btn-outline{background:transparent;border-color:var(--steel-500);color:var(--steel-300)}.btn-amber{background:transparent;border-color:var(--amber-500);color:var(--amber-500)}.btn-primary{background:linear-gradient(90deg,var(--green-600),var(--green-500));border-color:transparent;color:#fff}.btn-submit{margin-top:10px;width:100%;background:linear-gradient(90deg,#c23b41,var(--red-500));border:none;color:#fff;font-family:var(--font-display);font-size:16px;padding:15px;border-radius:var(--radius-md);cursor:pointer}.station-map{margin-top:18px;background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);padding:18px}.sm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sm-header h2{font-family:var(--font-display);font-size:15px;margin:0;color:var(--white)}.sm-header span{font-family:var(--font-mono);font-size:12px;color:var(--steel-300)}.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:16px;font-size:11.5px;color:var(--steel-300)}.legend-item{display:flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.dot.not-visited{background:var(--steel-500)}.dot.not-answered{background:var(--red-500)}.dot.answered{background:var(--green-500)}.dot.marked{background:var(--amber-500)}.dot.answered-marked{background:var(--violet-500)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.station{aspect-ratio:1/1;border-radius:var(--radius-sm);border:1.5px solid transparent;background:var(--navy-800);color:var(--off-white);font-family:var(--font-mono);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}.station.not-answered{background:var(--red-500);color:#fff}.station.answered{background:var(--green-500);color:#fff}.station.marked{background:var(--amber-500);color:#182234}.station.answered-marked{background:var(--violet-500);color:#fff}.station.current{border-color:var(--white);box-shadow:0 0 0 3px rgba(255,255,255,.15)}.overlay{position:fixed;inset:0;background:rgba(5,10,20,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.open{display:flex}.modal{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);max-width:420px;width:100%;padding:24px 22px}.modal h3{font-family:var(--font-display);font-size:19px;margin:0 0 4px;color:var(--white)}.modal p.sub{font-size:13px;color:var(--steel-300);margin:0 0 18px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:var(--navy-800);border-radius:var(--radius-sm);padding:12px;text-align:center}.stat .num{font-family:var(--font-mono);font-size:20px;font-weight:700}.stat .lbl{font-size:11px;color:var(--steel-300);margin-top:2px}.stat.green .num{color:var(--green-500)}.stat.red .num{color:var(--red-500)}.stat.amber .num{color:var(--amber-500)}.stat.steel .num{color:var(--steel-300)}.modal-actions{display:flex;gap:10px}.modal-actions .btn{flex:1}.answer-key-wrap{display:grid;gap:14px}.answer-key-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px}.answer-key-topbar h2{font-family:var(--font-display);font-size:18px;color:var(--white);margin:0}.answer-card{background:var(--off-white);color:#182234;border-radius:var(--radius-lg);padding:20px}.answer-card .q-text{margin-bottom:14px}.answer-card .option{cursor:default}.answer-card .answer-label{margin-top:10px;font-size:13px;color:#5b6779;font-weight:600}
@media(max-width:899px){.app{padding-left:10px;padding-right:10px}.main-grid{display:block}.station-map{margin-top:18px}.question-card{padding:20px 16px}.q-text{font-size:18px}.header-left h1{font-size:20px}.led{font-size:24px}}
@media(min-width:900px){.app{padding-top:24px}.main-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}.station-map{margin-top:0;position:sticky;top:20px}.grid{grid-template-columns:repeat(5,1fr)}}

</head><body>
<div class="rail-strip"></div><div class="app"><div class="header"><div class="header-left"><p class="eyebrow">রেলওয়ে মক টেস্ট সিরিজ</p><h1 id="testTitle">লোড হচ্ছে…</h1><span class="subject-tag" id="testSubtitle"></span></div><div class="timer-box"><p class="timer-label">সময় বাকি</p><div class="led" id="timerDisplay">--:--</div></div></div><div class="journey" id="journeyBar" style="display:none"><div class="journey-label"><span>স্টেশন ১ থেকে যাত্রা শুরু</span><span><b id="progressText">1</b> / <span id="totalQCount">0</span></span></div><div class="track-wrap"><div class="track-fill" id="trackFill"></div><div class="train-marker" id="trainMarker">🚂</div></div></div><div id="mainGrid"><div class="ui-load-state">প্রশ্ন লোড হচ্ছে…</div></div></div><div class="overlay" id="overlay"><div class="modal"><h3 id="modalTitle">টেস্ট জমা দেবেন?</h3><p class="sub" id="modalSub">জমা দেওয়ার আগে নিচের সারাংশ দেখে নিন।</p><div class="stat-grid" id="statGrid"></div><div class="modal-actions" id="modalActions"></div></div></div>
<script>
function sanitizeSegment(v=""){return String(v||"").trim().replace(/[\\/]+/g,"").replace(/\s+/g," ")}
function joinPath(...parts){return parts.flat().map(sanitizeSegment).filter(Boolean).join("/")}
function getParams(){return Object.fromEntries(new URL(location.href).searchParams.entries())}
let CONFIG=null,N=0,state=[],current=0,remaining=1200,timerHandle=null,submitted=false,startedAt=null;
const STATUS_LABEL={"not-visited":"দেখা হয়নি","not-answered":"উত্তর দেওয়া হয়নি","answered":"উত্তর দেওয়া হয়েছে","marked":"পর্যালোচনার জন্য","answered-marked":"উত্তর + পর্যালোচনা"};
const STATUS_COLOR={"not-visited":"#7c8aa0","not-answered":"#e0525a","answered":"#1fa259","marked":"#e6a23c","answered-marked":"#8b6cf6"};
const testShellHTML=`<div><div class="question-card"><div class="q-meta"><span class="q-count">Question <span id="qIndex">1</span> of <span id="qTotal">0</span></span><span class="q-status-chip" id="statusChip" style="background:#7c8aa0;">দেখা হয়নি</span></div><h2 class="q-text" id="qText"></h2><div class="options" id="optionsWrap"></div></div><div class="actions"><button class="btn btn-outline" id="btnPrev">← Previous</button><button class="btn btn-outline" id="btnClear">Clear Response</button><button class="btn btn-amber" id="btnMark">Mark for Review</button><button class="btn btn-primary" id="btnNext">Save & Next →</button></div><button class="btn-submit" id="btnSubmit">Submit Test জমা দিন</button></div><div class="station-map"><div class="sm-header"><h2>স্টেশন ম্যাপ</h2><span id="smCounter">1/0</span></div><div class="legend"><span class="legend-item"><span class="dot not-visited"></span>দেখা হয়নি</span><span class="legend-item"><span class="dot not-answered"></span>উত্তর দেওয়া হয়নি</span><span class="legend-item"><span class="dot answered"></span>উত্তর দেওয়া হয়েছে</span><span class="legend-item"><span class="dot marked"></span>পর্যালোচনার জন্য</span><span class="legend-item"><span class="dot answered-marked"></span>উত্তর + পর্যালোচনা</span></div><div class="grid" id="paletteGrid"></div></div>`;
let el={};
function bindEls(){el={timer:document.getElementById("timerDisplay"),trackFill:document.getElementById("trackFill"),trainMarker:document.getElementById("trainMarker"),progressText:document.getElementById("progressText"),totalQCount:document.getElementById("totalQCount"),qIndex:document.getElementById("qIndex"),qTotal:document.getElementById("qTotal"),qText:document.getElementById("qText"),optionsWrap:document.getElementById("optionsWrap"),statusChip:document.getElementById("statusChip"),paletteGrid:document.getElementById("paletteGrid"),smCounter:document.getElementById("smCounter"),btnPrev:document.getElementById("btnPrev"),btnClear:document.getElementById("btnClear"),btnMark:document.getElementById("btnMark"),btnNext:document.getElementById("btnNext"),btnSubmit:document.getElementById("btnSubmit")}}
function visit(i){if(state[i].status==="not-visited")state[i].status="not-answered"}
function selectOption(i){state[current].selected=i;state[current].status=(state[current].status==="marked"||state[current].status==="answered-marked")?"answered-marked":"answered";render()}
function clearResponse(){state[current].selected=null;state[current].status=state[current].status==="answered-marked"?"marked":"not-answered";render()}
function markForReview(){state[current].status=state[current].selected!==null?"answered-marked":"marked";if(current<N-1)goTo(current+1);else render()}
function saveAndNext(){if(current<N-1)goTo(current+1);else openSubmitModal(false)}
function goPrev(){goTo(current-1)}
function goTo(i){if(i<0||i>=N){render();return}current=i;visit(current);render()}
function render(){const q=CONFIG.questions[current],s=state[current];el.qIndex.textContent=current+1;el.qText.textContent=q.question;el.progressText.textContent=current+1;el.smCounter.textContent=`${current+1}/${N}`;el.statusChip.textContent=STATUS_LABEL[s.status];el.statusChip.style.background=STATUS_COLOR[s.status];el.optionsWrap.innerHTML="";q.options.forEach((t,i)=>{const letter=String.fromCharCode(65+i),b=document.createElement("button");b.className="option"+(s.selected===i?" selected":"");b.innerHTML=`<span class="badge">${letter}</span><span class="opt-text"></span><span class="check">${s.selected===i?"✓":""}</span>`;b.querySelector(".opt-text").textContent=t;b.addEventListener("click",()=>selectOption(i));el.optionsWrap.appendChild(b)});el.btnPrev.disabled=current===0;const pct=N<=1?0:(current/(N-1))*100;el.trackFill.style.width=pct+"%";el.trainMarker.style.left=pct+"%";renderPalette()}
function buildPalette(){el.paletteGrid.innerHTML="";for(let i=0;i<N;i++){const b=document.createElement("button");b.className="station";b.textContent=i+1;b.addEventListener("click",()=>goTo(i));el.paletteGrid.appendChild(b)}}
function renderPalette(){for(let i=0;i<N;i++){const st=state[i].status,cls=["station"];if(st!=="not-visited")cls.push(st);if(i===current)cls.push("current");el.paletteGrid.children[i].className=cls.join(" ")}}
function startTimer(){updateTimerDisplay();timerHandle=setInterval(()=>{if(submitted)return;remaining--;updateTimerDisplay();if(remaining<=0){clearInterval(timerHandle);timerHandle=null;openSubmitModal(true)}},1000)}
function updateTimerDisplay(){const m=Math.floor(remaining/60).toString().padStart(2,"0"),s=(remaining%60).toString().padStart(2,"0");el.timer.textContent=`${m}:${s}`;el.timer.classList.toggle("danger",remaining<=60)}
function computeStats(){let answered=0,notAnswered=0,marked=0,notVisited=0,correct=0,wrong=0;state.forEach((s,i)=>{if(s.status==="not-visited")notVisited++;if(s.status==="not-answered"||s.status==="marked")notAnswered++;if(s.status==="answered"||s.status==="answered-marked")answered++;if(s.status==="marked"||s.status==="answered-marked")marked++;if(s.selected!==null){if(s.selected===CONFIG.questions[i].answer)correct++;else wrong++}});return{answered,notAnswered,marked,notVisited,correct,wrong}}
function getScore(st){const correctMark=Number(CONFIG.marksPerQuestion??1)||0;const negative=Number(CONFIG.negativeMarks??0)||0;return st.correct*correctMark-st.wrong*negative}
function openSubmitModal(timeUp){const st=computeStats(),overlay=document.getElementById("overlay"),statGrid=document.getElementById("statGrid"),modalActions=document.getElementById("modalActions");document.getElementById("modalTitle").textContent=timeUp?"সময় শেষ!":"টেস্ট জমা দেবেন?";document.getElementById("modalSub").textContent=timeUp?"সময় শেষ হয়ে গেছে, টেস্ট স্বয়ংক্রিয়ভাবে জমা হচ্ছে।":"জমা দেওয়ার আগে নিচের সারাংশ দেখে নিন।";statGrid.innerHTML=`<div class="stat green"><div class="num">${st.answered}</div><div class="lbl">উত্তর দেওয়া</div></div><div class="stat red"><div class="num">${st.notAnswered}</div><div class="lbl">উত্তর দেওয়া হয়নি</div></div><div class="stat amber"><div class="num">${st.marked}</div><div class="lbl">পর্যালোচনার জন্য</div></div><div class="stat steel"><div class="num">${st.notVisited}</div><div class="lbl">দেখা হয়নি</div></div>`;modalActions.innerHTML="";if(!timeUp){const b=document.createElement("button");b.className="btn btn-outline";b.textContent="ফিরে যান";b.addEventListener("click",()=>overlay.classList.remove("open"));modalActions.appendChild(b)}const c=document.createElement("button");c.className="btn btn-primary";c.textContent=timeUp?"ফলাফল দেখুন":"নিশ্চিত জমা দিন";c.addEventListener("click",finalizeSubmit);modalActions.appendChild(c);overlay.classList.add("open")}
function finalizeSubmit(){if(submitted)return;submitted=true;clearInterval(timerHandle);timerHandle=null;renderResultModal()}
function renderResultModal(){const st=computeStats(),total=N,score=getScore(st),scorePct=total?Math.round((st.correct/total)*100):0,statGrid=document.getElementById("statGrid"),modalActions=document.getElementById("modalActions"),overlay=document.getElementById("overlay");document.getElementById("modalTitle").textContent="ফলাফল";document.getElementById("modalSub").textContent=`স্কোর: ${score} / ${total} (${scorePct}%)`;statGrid.innerHTML=`<div class="stat green"><div class="num">${st.correct}</div><div class="lbl">সঠিক উত্তর</div></div><div class="stat red"><div class="num">${st.wrong}</div><div class="lbl">ভুল উত্তর</div></div><div class="stat steel"><div class="num">${total-st.correct-st.wrong}</div><div class="lbl">উত্তর দেওয়া হয়নি</div></div><div class="stat amber"><div class="num">${scorePct}%</div><div class="lbl">স্কোর</div></div>`;modalActions.innerHTML="";const retryBtn=document.createElement("button");retryBtn.className="btn btn-primary";retryBtn.textContent="আবার শুরু করুন";retryBtn.addEventListener("click",()=>location.reload());const answerBtn=document.createElement("button");answerBtn.className="btn btn-outline";answerBtn.textContent="উত্তর দেখুন";answerBtn.addEventListener("click",showAnswerKey);modalActions.appendChild(retryBtn);modalActions.appendChild(answerBtn);overlay.classList.add("open")}
function showAnswerKey(){document.getElementById("overlay").classList.remove("open");document.getElementById("journeyBar").style.display="none";document.getElementById("mainGrid").className="answer-key-wrap";document.getElementById("mainGrid").innerHTML=buildAnswerKeyHTML();document.getElementById("btnBackToResult")?.addEventListener("click",renderResultModal)}
function buildAnswerKeyHTML(){const cards=CONFIG.questions.map((q,i)=>{const sel=state[i].selected;const status=sel===null?"উত্তর দেওয়া হয়নি":sel===q.answer?"সঠিক":"ভুল";const statusColor=sel===null?"#7c8aa0":sel===q.answer?"#1fa259":"#e0525a";const optsHTML=q.options.map((opt,j)=>{let cls="option";if(j===q.answer)cls+=" correct";else if(sel===j)cls+=" wrong";const d=document.createElement("div");d.className=cls;d.innerHTML=`<span class="badge">${String.fromCharCode(65+j)}</span><span class="opt-text"></span>`;d.querySelector(".opt-text").textContent=opt;return d.outerHTML}).join("");const qEl=document.createElement("h2");qEl.className="q-text";qEl.textContent=q.question;let explanation="";if(q.explanation){const ex=document.createElement("div");ex.className="answer-label";const b=document.createElement("b");b.textContent="ব্যাখ্যা: ";ex.appendChild(b);const s=document.createElement("span");s.textContent=q.explanation;ex.appendChild(s);explanation=ex.outerHTML}return `<div class="answer-card"><div class="q-meta"><span class="q-count">প্রশ্ন ${i+1}</span><span class="q-status-chip" style="background:${statusColor}">${status}</span></div>${qEl.outerHTML}<div class="options">${optsHTML}</div>${explanation}<div class="answer-label">সঠিক উত্তর: ${String.fromCharCode(65+Number(q.answer))}</div></div>`}).join("");return `<div class="answer-key-topbar"><h2>উত্তরপত্র (Answer Key)</h2><button class="btn btn-outline" id="btnBackToResult">← ফলাফলে ফিরে যান</button></div>${cards}`}
function showError(msg){document.getElementById("mainGrid").innerHTML=`<div class="ui-load-state"><p>${msg}</p></div>`}
function startTest(){N=CONFIG.questions.length;if(!N){showError("এই মক টেস্টে কোনো প্রশ্ন পাওয়া যায়নি।");return}document.getElementById("testTitle").textContent=CONFIG.title||"মক টেস্ট";document.getElementById("testSubtitle").textContent=CONFIG.subtitle||"";document.getElementById("journeyBar").style.display="";document.getElementById("totalQCount").textContent=N;document.getElementById("mainGrid").className="main-grid";document.getElementById("mainGrid").innerHTML=testShellHTML;bindEls();el.qTotal.textContent=N;state=CONFIG.questions.map(()=>({selected:null,status:"not-visited"}));const minutes=Number(CONFIG.durationMinutes)||20;remaining=Math.max(1,Math.round(minutes*60));startedAt=Date.now();el.btnPrev.addEventListener("click",goPrev);el.btnClear.addEventListener("click",clearResponse);el.btnMark.addEventListener("click",markForReview);el.btnNext.addEventListener("click",saveAndNext);el.btnSubmit.addEventListener("click",()=>{if(submitted){renderResultModal();return}openSubmitModal(false)});buildPalette();visit(0);render();startTimer()}
function normalizeConfig(data){const marking=data.marking||{};return{title:data.title||"মক টেস্ট",subtitle:data.subtitle||"",durationMinutes:Math.max(1,Number(data.durationMinutes)||20),marksPerQuestion:Number.isFinite(Number(marking.correct))?Number(marking.correct):1,negativeMarks:Number.isFinite(Number(marking.incorrect))?Number(marking.incorrect):0,questions:Array.isArray(data.questions)?data.questions:[]}}
async function loadConfig(){if(window.MOCK_TEST_CONFIG){CONFIG=normalizeConfig(window.MOCK_TEST_CONFIG);startTest();return}const params=getParams();const category=sanitizeSegment(params.category||"");const seg=sanitizeSegment(params.path||"");if(!category){showError("কোনো মক টেস্ট নির্বাচন করা হয়নি।");return}const jsonPath="data/"+joinPath(category,seg)+"/mock-test.json";try{const res=await fetch(jsonPath,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();CONFIG=normalizeConfig(data);startTest()}catch(e){console.error("Mock test load failed:",jsonPath,e);showError(`মক টেস্ট লোড করা যায়নি।<code>${jsonPath}</code>`)}}
loadConfig();
</script></body></html>
