<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>খাতার নোট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fefcf6;--margin-red:#d9524c;--ink-black:#1d1d1f;--ink-blue:#1a3aad;--imp-red:#c8281f;--heading-1:#ff7a3d;--heading-2:#e6423c;--accent-green:#22c55e;--accent-yellow:#eab308;--btn-1:#ec4899;--btn-2:#8b5cf6}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#f4efe2;min-height:100vh;padding:22px 14px 60px;font-family:'Atma',cursive}.wrap{max-width:640px;margin:0 auto}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Baloo Da 2',cursive;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--btn-1),var(--btn-2));border:none;padding:10px 26px;border-radius:999px;box-shadow:0 6px 14px rgba(139,92,246,.35);cursor:pointer;text-decoration:none;margin-bottom:22px}.back-btn:active{transform:translateY(1px)}
.heading-row{display:flex;align-items:stretch;gap:16px;margin-bottom:22px}.accent-bar{flex:0 0 5px;border-radius:4px;background:linear-gradient(180deg,var(--accent-green),var(--accent-yellow))}.heading-text{font-family:'Baloo Da 2',cursive;font-weight:800;font-size:32px;line-height:1.2;margin:0;background:linear-gradient(180deg,var(--heading-1),var(--heading-2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(180,40,30,.35);letter-spacing:.01em}
.page{position:relative;background:var(--paper);border-radius:14px;box-shadow:0 10px 26px rgba(60,40,10,.14);padding:28px 22px 32px 54px}.page::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:var(--margin-red);opacity:.55}
.sub-heading{font-family:'Baloo Da 2',cursive;font-weight:700;font-size:24px;color:var(--ink-black);margin:0 0 10px;display:inline-block;position:relative}.sub-heading::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:8px;background:rgba(234,179,8,.35);z-index:-1;border-radius:2px}
p{font-size:22px;line-height:1.65;margin:0 0 16px}.ink-black{color:var(--ink-black)}.ink-blue{color:var(--ink-blue)}.imp{color:var(--imp-red);font-weight:700}.section{margin-bottom:6px}.stage-list{margin:0 0 16px;padding-left:26px}.stage-list li{font-size:22px;line-height:1.65;color:var(--ink-blue);margin-bottom:4px}.stage-list li b{color:var(--ink-black)}
.notes-error{font-family:Inter,Arial,sans-serif;background:#fff;border:1px solid #eadfc4;border-radius:14px;padding:18px;color:#222}.notes-error code{word-break:break-word}.load-box{min-height:160px;display:grid;place-items:center;text-align:center;color:#6b6357;font-family:'Baloo Da 2',cursive;font-size:18px}
@media(max-width:420px){.heading-text{font-size:26px}p,.sub-heading,.stage-list li{font-size:19px}.page{padding:24px 16px 26px 42px}.page::before{left:26px}}
@media(prefers-reduced-motion:no-preference){.page{animation:riseIn .5s ease both}.heading-row{animation:riseIn .4s ease both}}@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load-box">নোট লোড হচ্ছে…</div></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const clean=s=>String(s||'').trim().replace(/[\\/]+/g,'').replace(/\s+/g,' ');
  const category=clean(params.get('category'));
  const rawPath=String(params.get('path')||'').trim();
  const segs=rawPath?rawPath.split('/').map(clean).filter(Boolean):[params.get('subject'),params.get('chapter'),params.get('topic')].map(clean).filter(Boolean);
  const base=['data',category,...segs].filter(Boolean).join('/');
  const app=document.getElementById('app');
  const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const title=v=>String(v||'').replaceAll('-',' ').replace(/\b\w/g,m=>m.toUpperCase());
  const parseInline=text=>String(text||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<span class="imp">$1</span>');
  const paragraphHTML=text=>String(text||'').split(/\n\n+/).map((p,i)=>`<p class="${i%2?'ink-blue':'ink-black'}">${parseInline(esc(p)).replaceAll('\n','<br>')}</p>`).join('');
  async function readJSON(path){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)return null;const t=await r.text();if(!t.trim())return null;return JSON.parse(t)}catch(e){console.warn('Notes load failed:',path,e);return null}}
  async function findNote(){
    const candidates=[`${base}/notes.json`,`${base}/theory/notes.json`];
    for(const p of candidates){const d=await readJSON(p);if(d)return{data:d,path:p}}
    return{data:null,path:candidates.join(' or ')};
  }
  function render(data){
    const heading=esc(data.title||`${title(segs.at(-1)||category)} — Notes`);
    const body=String(data.content||'');
    app.innerHTML=`<a class="back-btn" href="javascript:history.back()">← Back</a><div class="heading-row"><div class="accent-bar"></div><h1 class="heading-text"><span>🪨</span> ${heading}</h1></div><div class="page"><div id="noteBody"></div></div>`;
    document.getElementById('noteBody').innerHTML=paragraphHTML(body);
  }
  findNote().then(({data,path})=>{if(!data){app.innerHTML=`<div class="notes-error"><a class="back-btn" href="javascript:history.back()">← Back</a><h2>Notes could not be loaded</h2><p>Expected content at:</p><code>${esc(path)}</code></div>`;return}render(data)});
})();
</script>
</body>
</html>
