<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Atma:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap');
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(0,0,0,.02) 27px 28px),#fbf6e9;min-height:100vh;padding:22px 14px 60px;font-family:'Atma',cursive}
    #app{max-width:640px;margin:0 auto}
    .notes-wrap{max-width:640px;margin:0 auto}
    .notes-back{display:inline-flex;align-items:center;gap:6px;font-family:'Baloo Da 2',cursive;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#ec4899,#8b5cf6);border:none;padding:10px 26px;border-radius:999px;box-shadow:0 6px 14px rgba(139,92,246,.35);cursor:pointer;text-decoration:none;margin-bottom:22px}
    .notes-heading-row{display:flex;align-items:stretch;gap:16px;margin-bottom:22px}
    .notes-accent-bar{flex:0 0 5px;border-radius:4px;background:linear-gradient(180deg,#22c55e,#eab308)}
    .notes-heading-text{font-family:'Baloo Da 2',cursive;font-weight:800;font-size:32px;line-height:1.2;margin:0;background:linear-gradient(180deg,#ff7a3d,#e6423c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(180,40,30,.35);letter-spacing:.01em}
    .notes-page{position:relative;background:repeating-linear-gradient(to bottom,transparent 0 38px,#a9c8ee 38px 39px),#faf3df;border-radius:14px;box-shadow:0 10px 26px rgba(60,40,10,.14);padding:26px 20px 30px 58px;overflow:hidden}
    .notes-page::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:#d9524c;opacity:.65}
    .notes-section{margin-bottom:8px}
    .notes-sub-heading{font-family:'Baloo Da 2',cursive;font-weight:700;font-size:24px;color:#1d1d1f;margin:0 0 6px;line-height:39px;display:inline-block;position:relative}
    .notes-sub-heading::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:8px;background:rgba(234,179,8,.35);z-index:-1;border-radius:2px}
    .notes-content p{font-size:22px;line-height:39px;margin:0 0 6px;white-space:pre-wrap}
    .notes-content .ink-black{color:#1d1d1f}.notes-content .ink-blue{color:#1a3aad}
    .notes-stage-list{margin:0 0 6px;padding-left:26px}.notes-stage-list li{font-size:22px;line-height:39px;color:#1a3aad}.notes-stage-list li b{color:#1d1d1f}
    .notes-state{font-size:22px;line-height:39px;color:#1d1d1f}
    .notes-error{font-family:Inter,Arial,sans-serif;background:#fff;border:1px solid #eadfc4;border-radius:14px;padding:18px;color:#222}
    @media(max-width:420px){.notes-heading-text{font-size:26px}.notes-content p,.notes-sub-heading,.notes-stage-list li,.notes-state{font-size:19px;line-height:34px}.notes-page{background:repeating-linear-gradient(to bottom,transparent 0 34px,#a9c8ee 34px 35px),#faf3df;padding:22px 14px 26px 46px}.notes-page::before{left:28px}.notes-sub-heading{line-height:34px}}
    @media(prefers-reduced-motion:no-preference){.notes-page{animation:riseIn .5s ease both}.notes-heading-row{animation:riseIn .4s ease both}}
    @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const category=(params.get('category')||'').trim().replace(/[\\/]+/g,'').replace(/\s+/g,' ');
  const rawPath=(params.get('path')||'').trim();
  const segs=rawPath?rawPath.split('/').map(s=>s.trim().replace(/[\\/]+/g,'').replace(/\s+/g,' ')).filter(Boolean):[params.get('subject'),params.get('chapter'),params.get('topic')].map(s=>(s||'').trim().replace(/[\\/]+/g,'').replace(/\s+/g,' ')).filter(Boolean);
  const base=['data',category,...segs].filter(Boolean).join('/');
  const app=document.getElementById('app');
  function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
  function title(v){return String(v||'').replaceAll('-',' ').replace(/\b\w/g,m=>m.toUpperCase())}
  function set(html){app.innerHTML=html}
  function paragraphHTML(text){return String(text||'').split(/\n\n+/).map((p,i)=>`<p class="${i%2?'ink-blue':'ink-black'}">${esc(p).replaceAll('\n','<br>')}</p>`).join('')}
  async function load(){
    const candidates=[`${base}/notes.json`,`${base}/theory/notes.json`];
    let data=null;
    for(const path of candidates){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)continue;const t=await r.text();if(!t.trim())continue;data=JSON.parse(t);break}catch(e){console.warn('Notes load failed',path,e)}}
    if(!data){set(`<div class="notes-error"><a class="notes-back" href="javascript:history.back()">← Back</a><h2>Notes could not be loaded</h2><p>Expected content at:</p><code>${esc(candidates.join(' or '))}</code></div>`);return}
    const body=String(data.content||'');
    set(`<div class="notes-wrap"><a class="notes-back" href="javascript:history.back()">← Back</a><div class="notes-heading-row"><div class="notes-accent-bar"></div><h1 class="notes-heading-text"><span>🪨</span> ${esc(data.title||`${title(segs.at(-1)||category)} — Notes`)}</h1></div><div class="notes-page"><div class="notes-section"><span class="notes-sub-heading">প্রস্তর যুগের পরিচয়</span></div><div class="notes-content">${paragraphHTML(body)}</div></div></div>`)
  }
  set(`<div class="notes-error"><div>Loading…</div></div>`);load();
})();
</script>
</body>
</html>
